name: Spellcheck

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "1.0"
  pull_request:

jobs:
  codespell:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install codespell
        run: |
          python -m pip install --upgrade pip
          pip install codespell

      - name: Run codespell
        run: codespell --config .codespellrc
