[package]
name = "valkey-ldap"
authors = ["Ricardo Dias"]
version = "1.2.0-dev"
edition = "2024"
build = "build.rs"
license = "BSD-3-Clause"
repository = "https://github.com/valkey-io/valkey-ldap"
description = "An LDAP authentication module for Valkey"
readme = "README.md"

[lib]
crate-type = ["cdylib"]

[features]
default = ["min-valkey-compatibility-version-8-0"]
# When enabled, LDAP config names are registered with an `ldap_` prefix so a
# host module embedding this crate exposes them grouped under `<host>.ldap_*`
# (e.g. `falkordbe.ldap_servers`). Standalone builds leave this off and keep
# `ldap.*`.
embed = []
enable-system-alloc = ["valkey-module/enable-system-alloc"]
min-redis-compatibility-version-7-2 = ["valkey-module/min-redis-compatibility-version-7-2"]
min-valkey-compatibility-version-8-0 = ["valkey-module/min-valkey-compatibility-version-8-0"]

[dependencies]
valkey-module = { version="0.1.9", features = ["use-redismodule-api"]}
ldap3 = "0.11.5"
lazy_static = "1.5.0"
paste = "1.0.15"
url = "2.5.4"
log = "0.4.27"
native-tls = "0.2.14"
rand = "0.9.1"
const-str = "0.6.2"
futures = "0.3.31"
tokio = {version="1.45.0", features=["rt", "rt-multi-thread", "macros"]}
valkey-module-macros = "0.1.9"
linkme = "0.3.33"
strum_macros = "0.27.1"
regex = "1.12.2"
